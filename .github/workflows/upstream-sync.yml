name: Sync Upstream Laws

on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab
  schedule:
    - cron: '0 2 * * 1' # Runs every Monday at 02:00 UTC

permissions:
  contents: write

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # sync_upstream.py ends by verifying the VuePress build, which needs the
      # npm toolchain (vuepress binary). Without this step the verification
      # always failed with "vuepress: not found" (exit 127) — after the laws
      # were synced but before anything was committed, so the weekly sync
      # never actually shipped.
      - name: Install dependencies
        run: npm install

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run Upstream Sync Tool
        run: |
          python scripts/sync_upstream.py

      - name: Commit and Push Changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "chore(sync): 自动同步上游最新法律法规条文与语料库"
            git push origin master
          else
            echo "No upstream changes to sync."
          fi
