name: Build and Deploy
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  Build-and-Deploy:
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: '20'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run tests
        # Node corpus-builder tests + stdlib-only Python unit tests (no pip install needed).
        run: npm test

      - name: Build documentation site
        run: npm run docs:build
        
      # Only publish on push to master — never deploy from pull_request builds.
      - name: Deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: easingthemes/ssh-deploy@2cc5b27bf3029d0455dd5e09fe02633904031447 # v6.0.3
        with:
          SSH_PRIVATE_KEY: ${{ secrets.ACCESS_TOKEN }}
          ARGS: "-rltgoDzvO --delete"
          SOURCE: "docs/.vuepress/dist/"
          REMOTE_HOST: ${{ secrets.SERVER_HOST }}
          REMOTE_USER: ${{ secrets.USER_NAME }}
          TARGET: "/usr/share/nginx/html/justlaws"
