name: Build and Test
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  Build-and-Test:
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: '20'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run tests
        # Node corpus-builder tests + stdlib-only Python unit tests (no pip install needed).
        run: npm test

      - name: Build documentation site
        run: npm run docs:build

      # Deployment to GitHub Pages is handled by pages.yml (Settings → Pages →
      # Source: GitHub Actions). The previous SSH/rsync deploy to a self-hosted
      # nginx server was removed once that server became unavailable; restore
      # it from git history if the server ever comes back.
