name: Deploy to GitHub Pages

# Builds the VuePress static site (including the client-side law corpus) and
# publishes it to GitHub Pages. Runs alongside the existing nginx deploy
# (main.yml) so the site keeps working until DNS is cut over to Pages.
#
# Manual steps required once (cannot be done from the repo):
#   1. Repo Settings → Pages → Source = "GitHub Actions".
#   2. Point the custom domain's DNS at GitHub Pages (CNAME www -> <user>.github.io
#      or the 4 apex A records) and keep docs/.vuepress/public/CNAME in sync.
on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent Pages deployment; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build documentation site
        run: npm run docs:build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vuepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
