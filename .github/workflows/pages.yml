name: Deploy to GitHub Pages

# Builds the VuePress static site (including the client-side law corpus) and
# publishes it to GitHub Pages as a project site at
# https://<user>.github.io/just-laws/ (served under the /just-laws/ base path).
#
# Manual step required once (cannot be done from the repo):
#   Repo Settings → Pages → Source = "GitHub Actions".
#
# If you later attach a custom domain you own, set Settings → Pages → Custom
# domain, add a CNAME file under docs/.vuepress/public/, and build with
# JUSTLAWS_BASE=/ instead of /just-laws/.
on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent Pages deployment; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build documentation site
        run: npm run docs:build
        env:
          # Project site lives under /just-laws/; build all asset/link URLs
          # against that base. Override to / if using a root custom domain.
          JUSTLAWS_BASE: /just-laws/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vuepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
